<style>
* {

html, body {

}
body {
  min-height: 100vh;
}
.container {
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  padding: 20px 16px 40px 16px;
}
h1 {
  font-size: 24px;
  text-align: center;
  margin: 10px 0 25px 0;
}
.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.label {
  font-size: 14px;
  color: #666;
  margin-bottom: 7px;
}
select, input {
  width: 100%;
  min-height: 52px;
  border: 1px solid #bbb;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 18px;
  background: white;
}
input {
  font-size: 22px;
  text-align: center;
}
button {
  width: 100%;
  min-height: 52px;
  border: none;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}
.startButton {
  background: #333;
  color: white;
}
.nextButton {
  background: #333;
  color: white;
}
.retryButton {
  background: #555;
  color: white;
}
.reviewButton {
  background: #777;
  color: white;
}
.questionNumber {
  text-align: center;
  font-size: 16px;
  color: #666;
  margin-bottom: 12px;
}
.sentence {
  font-size: 25px;
  line-height: 2.2;
  text-align: center;
  margin: 15px 0 25px 0;
  overflow-wrap: break-word;
}
.target {
  font-weight: bold;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 4px;
}
ruby {
  ruby-position: over;
}
rt {
  font-size: 0.45em;
  line-height: 1;
  color: #444;
}
.feedback {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin: 15px 0;
}
.correct {
  color: #008000;
}
.incorrect {
  color: #cc0000;
}
.answerText {
  text-align: center;
  font-size: 20px;
  margin: 10px 0;
}
.resultNumber {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  margin: 20px 0;
}
.resultDetail {
  text-align: center;
  font-size: 20px;
  line-height: 1.8;
}
.hidden {
  display: none;
}
@media (max-width: 480px) {
  .container {
    padding: 15px 12px 30px 12px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 20px;
  }
  .card {
    padding: 16px;
    border-radius: 12px;
  }
  .sentence {
    font-size: 23px;
    line-height: 2.25;
  }
  rt {

  }
}
</style>
</head>

<button class="startButton" onclick="startQuiz()">スタート</button>
</div>
</div>

<button id="nextButton" class="nextButton hidden" onclick="nextQuestion()">次の問題</button>

</div>
<div id="resultScreen" class="hidden">

<button class="retryButton" onclick="retryAll()">もう一度すべて解く</button>
<button class="retryButton" onclick="backToSetup()">設定画面に戻る</button>
</div>
</div>

let questions = [];
let currentIndex = 0;
let correctCount = 0;
let incorrectCount = 0;
let wrongQuestions = [];
let answered = false;

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function normalizeAnswer(text) {
  text = text.trim();
  return text.replace(/[ァ-ヶ]/g, function(ch) {
    return String.fromCharCode(ch.charCodeAt(0) - 0x60);
  });
}

function startQuiz() {
  const selectedLevel = document.getElementById('levelSelect').value;
  const selectedCount = document.getElementById('countSelect').value;
  let filtered;
  if (selectedLevel === 'random') {
    filtered = [...allQuestions];
  } else {
    filtered = allQuestions.filter(q => q.level === selectedLevel);
  }
  questions = shuffle(filtered);
  if (selectedCount !== 'all') {
    questions = questions.slice(0, Number(selectedCount));
  }
  if (questions.length === 0) {
    alert('このレベルの問題がありません。');
    return;
  }
  currentIndex = 0;
  correctCount = 0;
  incorrectCount = 0;
  wrongQuestions = [];
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[currentIndex];
  document.getElementById('questionNumber').textContent = '問題 ' + (currentIndex + 1) +  ' / ' + questions.length;
  document.getElementById('sentence').innerHTML = q.sentence;
  const input = document.getElementById('answerInput');
  input.value = '';
  input.disabled = false;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('correctAnswer').textContent = '';
  document.getElementById('checkButton').classList.remove('hidden');
  document.getElementById('nextButton').classList.add('hidden');
  input.focus();
}

function checkAnswer() {
  if (answered) return;
  const q = questions[currentIndex];
  const input = document.getElementById('answerInput');
  const userAnswer = normalizeAnswer(input.value);
  const correctAnswer = normalizeAnswer(q.answer);
  answered = true;
  input.disabled = true;
  if (userAnswer === correctAnswer) {
    correctCount++;
    document.getElementById('feedback').textContent = '○ 正解！';
    document.getElementById('feedback').className = 'feedback correct';
  } else {
    incorrectCount++;
    wrongQuestions.push(q);
    document.getElementById('feedback').textContent = '× 不正解';
    document.getElementById('feedback').className = 'feedback incorrect';
    document.getElementById('correctAnswer').textContent = '正解：' + q.answer;
  }
  document.getElementById('checkButton').classList.add('hidden');
  document.getElementById('nextButton').classList.remove('hidden');
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('resultNumber').textContent = correctCount + ' / ' + questions.length;
  document.getElementById('resultDetail').innerHTML = '○ 正解：' + correctCount + '問<br>' + '× 不正解：' + incorrectCount + '問';
  const reviewButton = document.querySelector('.reviewButton');
  if (wrongQuestions.length === 0) {
    reviewButton.classList.add('hidden');
  } else {
    reviewButton.classList.remove('hidden');
  }
}

function reviewWrong() {
  if (wrongQuestions.length === 0) return;
  questions = shuffle(wrongQuestions);
  currentIndex = 0;
  correctCount = 0;
  incorrectCount = 0;
  wrongQuestions = [];
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}

function retryAll() {
  questions = shuffle(questions);
  currentIndex = 0;
  correctCount = 0;
  incorrectCount = 0;
  wrongQuestions = [];
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}

function backToSetup() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('setupScreen').classList.remove('hidden');
}
