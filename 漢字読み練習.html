<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 20px 12px 40px;
  background: #f5f5f5;
  color: #333;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
  font-size: 16px;
}
.container {
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
}
h1 {
  text-align: center;
  font-size: 28px;
  margin: 10px 0 25px;
}
.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.question-number {
  text-align: center;
  font-size: 15px;
  color: #666;
  margin-bottom: 18px;
}
.sentence {
  font-size: 26px;
  line-height: 2.2;
  text-align: center;
  margin: 10px 0 25px;
  word-break: break-word;
}
.target {
  font-weight: bold;
  text-decoration: underline;
  text-decoration-thickness: 3px;
  text-underline-offset: 4px;
}
ruby {
  ruby-position: over;
}
rt {
  font-size: 0.45em;
  line-height: 1;
}
label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}
select, input {
  width: 100%;
  min-height: 52px;
  padding: 10px 14px;
  font-size: 18px;
  border: 1px solid #bbb;
  border-radius: 10px;
  background: white;
  margin-bottom: 18px;
}
button {
  width: 100%;
  min-height: 52px;
  padding: 10px 16px;
  margin-top: 8px;
  border: none;
  border-radius: 10px;
  background: #333;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
button:active {
  transform: scale(0.98);
}
.secondary {
  background: #777;
}
.answer-area {
  margin-top: 20px;
}
.feedback {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin: 18px 0;
}
.correct {
  color: #198754;
}
.incorrect {
  color: #dc3545;
}
.result {
  text-align: center;
  font-size: 22px;
  line-height: 1.8;
}
.score {
  font-size: 40px;
  font-weight: bold;
  margin: 20px 0;
}
.hidden {
  display: none;
}
.button-group {
  margin-top: 20px;
}
@media (max-width: 480px) {
  body {
    padding: 12px 8px 30px;
  }
  h1 {
    font-size: 24px;
  }
  .card {
    padding: 16px;
  }
  .sentence {
    font-size: 24px;
    line-height: 2.2;
  }

</style>
</head>

let quizQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongQuestions = [];
function escapeHTML(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function normalizeAnswer(str) {
  str = String(str).trim();
  return str.replace(/[ァ-ヶ]/g, function(ch) {
    return String.fromCharCode(ch.charCodeAt(0) - 0x60);
  });
}
function makeSentence(q) {
  let text = q.sentence;
  const target = escapeHTML(q.target);
  text = text.replace(target, '<span class="target">' + target + '</span>');
  return text;
}
function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function startQuiz() {
  const selectedLesson = document.getElementById('lessonSelect').value;
  const count = document.getElementById('questionCount').value;
  if (selectedLesson === 'random') {
    quizQuestions = questions.slice();
  } else {
    quizQuestions = questions.filter(function(q) {
      return q.lesson === selectedLesson;
    });
  }
  quizQuestions = shuffle(quizQuestions);
  if (count !== 'all') {
    const n = parseInt(count, 10);
    quizQuestions = quizQuestions.slice(0, n);
  }
  if (quizQuestions.length === 0) {
    alert('選択した課の問題がありません。');
    return;
  }
  currentIndex = 0;
  correctCount = 0;
  wrongQuestions = [];
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}
function showQuestion() {
  const q = quizQuestions[currentIndex];
  document.getElementById('questionNumber').textContent =
    (currentIndex + 1) + ' / ' + quizQuestions.length;
  document.getElementById('sentence').innerHTML = makeSentence(q);
  const input = document.getElementById('answerInput');
  input.value = '';
  input.disabled = false;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('checkButton').classList.remove('hidden');
  document.getElementById('nextButton').classList.add('hidden');
  setTimeout(function() {
    input.focus();
  }, 100);
}
function checkAnswer() {
  const q = quizQuestions[currentIndex];
  const input = document.getElementById('answerInput');
  const userAnswer = normalizeAnswer(input.value);
  const correctAnswer = normalizeAnswer(q.answer);
  const feedback = document.getElementById('feedback');
  if (userAnswer === correctAnswer) {
    correctCount++;
    feedback.textContent = '○ 正解！';
    feedback.className = 'feedback correct';
  } else {
    wrongQuestions.push(q);
    feedback.innerHTML = '× 不正解<br>正解：' + escapeHTML(q.answer);
    feedback.className = 'feedback incorrect';
  }
  input.disabled = true;
  document.getElementById('checkButton').classList.add('hidden');
  document.getElementById('nextButton').classList.remove('hidden');
}
function nextQuestion() {
  currentIndex++;
  if (currentIndex >= quizQuestions.length) {
    showResult();
  } else {
    showQuestion();
  }
}
function showResult() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('score').textContent =
    correctCount + ' / ' + quizQuestions.length;
  document.getElementById('resultDetail').innerHTML =
    '正解：' + correctCount + '問　／　不正解：' +
    (quizQuestions.length - correctCount) + '問';
}
function reviewWrong() {
  if (wrongQuestions.length === 0) {
    alert('間違えた問題はありません。');
    return;
  }
  quizQuestions = shuffle(wrongQuestions);
  currentIndex = 0;
  correctCount = 0;
  wrongQuestions = [];
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}
function repeatAll() {
  quizQuestions = shuffle(quizQuestions);
  currentIndex = 0;
  correctCount = 0;
  wrongQuestions = [];
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}
function backToStart() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}
document.getElementById('answerInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (!document.getElementById('checkButton').classList.contains('hidden')) {
      checkAnswer();
    } else if (!document.getElementById('nextButton').classList.contains('hidden')) {
      nextQuestion();
    }
  }
});
