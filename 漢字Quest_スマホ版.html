<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#667eea">
<title>漢字Quest</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Yu Gothic',sans-serif;background:#f4f6fb;color:#333;overscroll-behavior:none;}
.app{width:100%;max-width:600px;min-height:100vh;margin:0 auto;background:#fff;position:relative;}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));box-shadow:0 2px 8px rgba(0,0,0,.12);}
.headerInner{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.headerTitle{font-size:20px;font-weight:800;}
.headerXP{font-size:13px;font-weight:bold;background:rgba(255,255,255,.18);padding:5px 9px;border-radius:20px;white-space:nowrap;}
.screen{display:none;padding:18px 15px 35px;}
.screen.active{display:block;}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px rgba(0,0,0,.07);}
.hero{text-align:center;padding:25px 15px;background:linear-gradient(145deg,#f3f4ff,#ffffff);}
.heroIcon{font-size:55px;line-height:1.1;margin-bottom:8px;}
.heroTitle{font-size:26px;font-weight:800;margin:5px 0;}
.heroText{font-size:14px;color:#666;margin:6px 0;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.stat{text-align:center;background:#f6f7fb;border-radius:13px;padding:10px 4px;}
.stat strong{display:block;font-size:20px;line-height:1.2;}
.stat span{font-size:10px;color:#777;}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:15px;padding:13px 14px;margin:8px 0;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation;background:#667eea;color:white;}
.btn:active{transform:scale(.98);opacity:.9;}
.btn.secondary{background:#eef0f6;color:#444;}
.btn.green{background:#45a968;}
.selectBox{margin-bottom:16px;}
.selectBox label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;}
select{width:100%;height:50px;border:1px solid #ddd;border-radius:12px;padding:0 12px;font-size:16px;background:#fff;}
.quizTop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#777;margin-bottom:6px;}
.quizTags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{display:inline-block;padding:4px 8px;background:#eef0ff;color:#5c65c5;border-radius:15px;font-size:11px;font-weight:700;}
.progress{height:7px;background:#e9e9ef;border-radius:10px;overflow:hidden;margin:5px 0 16px;}
.progressBar{height:100%;width:0%;background:#667eea;border-radius:10px;transition:width .3s ease;}
.questionCard{padding:18px 12px 20px;text-align:center;}
.sentence{font-size:clamp(23px,7vw,32px);font-weight:800;line-height:1.8;word-break:break-word;margin:8px 0 12px;}
.blank{display:inline-block;min-width:70px;height:48px;line-height:42px;margin:0 3px;padding:0 7px;border-bottom:4px solid #667eea;color:#667eea;vertical-align:middle;}
.readingHint{display:inline-block;background:#fff5dc;border-radius:20px;padding:7px 14px;font-size:16px;color:#6d5a28;margin-bottom:8px;}
.questionText{font-size:14px;font-weight:700;color:#555;margin:8px 0 12px;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice{width:100%;min-height:68px;border:2px solid #e0e2e9;border-radius:16px;background:#fff;font-size:32px;font-weight:800;color:#333;cursor:pointer;touch-action:manipulation;box-shadow:0 2px 5px rgba(0,0,0,.04);transition:transform .1s,background .2s,border .2s;}
.choice:active{transform:scale(.97);}
.choice:disabled{cursor:default;}
.choice.correct{background:#e8f8ee;border-color:#45a968;color:#257840;}
.choice.wrong{background:#fff0f0;border-color:#e25c5c;color:#b53d3d;}
.feedback{display:none;border-radius:16px;padding:15px 10px;margin-top:12px;text-align:center;font-weight:700;font-size:15px;}
.feedback.correct{display:block;background:#e8f8ee;color:#267842;}
.feedback.wrong{display:block;background:#fff0f0;color:#b63d3d;}
.feedbackKanji{display:block;font-size:42px;line-height:1.2;margin:5px 0;}
.resultIcon{font-size:60px;text-align:center;margin:8px;}
.resultScore{text-align:center;font-size:42px;font-weight:800;color:#667eea;margin:8px 0;}
.kanjiGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.kanjiCard{background:#f5f6fa;border-radius:12px;padding:10px 3px;text-align:center;}
.kanjiCard .k{font-size:30px;font-weight:800;}
.kanjiCard .r{font-size:11px;color:#777;white-space:nowrap;overflow:hidden;}
.empty{text-align:center;color:#888;padding:30px 10px;font-size:14px;}
@media(max-width:380px){
.screen{padding-left:11px;padding-right:11px;}
.sentence{font-size:22px;}
.choice{min-height:62px;font-size:29px;}
.stats{gap:5px;}
}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="headerInner">
<div class="headerTitle">&#x1F3AF; 漢字Quest</div>
<div class="headerXP">&#x2B50; <span id="headerXP">0</span> XP</div>
</div>
</header>
<section id="home" class="screen active">
<div class="card hero">
<div class="heroIcon">&#x1F331;</div>
<div class="heroTitle">漢字Quest</div>
<div class="heroText">文章を読んで、正しい漢字を選ぼう！</div>
</div>
<div class="stats">
<div class="stat"><strong id="homeLearned">0</strong><span>覚えた漢字</span></div>
<div class="stat"><strong id="homeBest">0</strong><span>&#x1F525; 最高連続</span></div>
<div class="stat"><strong id="homeXP">0</strong><span>&#x2B50; XP</span></div>
</div>
<button class="btn" onclick="showScreen('setup')">&#x1F680; ミッションを始める</button>
<button class="btn secondary" onclick="showCollection()">&#x1F4DA; 漢字コレクション</button>
<button class="btn secondary" onclick="showMistakes()">&#x1F4AA; リベンジ問題</button>
</section>
<section id="setup" class="screen">
<div class="card">
<h2>&#x1F4CB; ミッション設定</h2>
<div class="selectBox">
<label>&#x1F4D6; レベル</label>
<select id="levelSelect">
<option value="ALL" selected>すべて</option>
<option value="N5">N5</option>
<option value="N4">N4</option>
<option value="N3">N3</option>
<option value="N2">N2</option>
<option value="N1">N1</option>
</select>
</div>
<div class="selectBox">
<label>&#x1F3AF; テーマ</label>
<select id="themeSelect">
<option value="ALL" selected>すべて</option>
</select>
</div>
<div class="selectBox">
<label>&#x1F522; 問題数</label>
<select id="countSelect">
<option value="10">10問</option>
<option value="20">20問</option>
<option value="ALL">全部</option>
</select>
</div>
<button class="btn" onclick="startQuiz()">&#x25B6;&#xFE0F; スタート</button>
<button class="btn secondary" onclick="showScreen('home')">&#x2B05;&#xFE0F; 戻る</button>
</div>
</section>
<section id="quiz" class="screen">
<div class="quizTop">
<span id="questionNo">問題 1 / 10</span>
<span>&#x1F525; <span id="quizStreak">0</span>連続</span>
</div>
<div class="progress"><div class="progressBar" id="progressBar"></div></div>
<div class="card questionCard">
<div class="quizTags"><span class="tag" id="quizLevel"></span><span class="tag" id="quizTheme"></span></div>
<div class="sentence" id="sentence"></div>
<div class="readingHint" id="readingHint"></div>
<div class="questionText">&#x1F4A1; この読みの漢字はどれですか？</div>
<div class="choices" id="choices"></div>
<div id="feedback" class="feedback"></div>
<button id="nextBtn" class="btn" style="display:none;margin-top:14px;" onclick="nextQuestion()">&#x27A1;&#xFE0F; 次の問題</button>
</div>
<div class="stats">
<div class="stat"><strong id="quizXP">0</strong><span>&#x2B50; XP</span></div>
<div class="stat"><strong id="quizCorrect">0</strong><span>&#x2705; 正解</span></div>
<div class="stat"><strong id="quizTotal">0</strong><span>問題</span></div>
</div>
</section>
<section id="result" class="screen">
<div class="card">
<div class="resultIcon">&#x1F389;</div>
<h2 style="text-align:center;">ミッション終了！</h2>
<div class="resultScore" id="resultScore">0 / 0</div>
<p style="text-align:center;" id="resultMessage"></p>
<div class="stats">
<div class="stat"><strong id="resultXP">0</strong><span>&#x2B50; 獲得XP</span></div>
<div class="stat"><strong id="resultStreak">0</strong><span>&#x1F525; 連続</span></div>
<div class="stat"><strong id="resultLearned">0</strong><span>&#x1F4DA; 漢字</span></div>
</div>
<button class="btn" onclick="startQuiz()">&#x1F501; もう一度</button>
<button class="btn secondary" onclick="showScreen('home')">&#x1F3E0; ホームへ</button>
</div>
</section>
<section id="collection" class="screen">
<div class="card">
<h2>&#x1F4DA; 漢字コレクション</h2>
<p style="font-size:14px;color:#666;">正解した漢字がここに集まります。</p>
<div class="kanjiGrid" id="collectionGrid"></div>
<button class="btn secondary" onclick="showScreen('home')">&#x2B05;&#xFE0F; 戻る</button>
</div>
</section>
<section id="mistakes" class="screen">
<div class="card">
<h2>&#x1F4AA; リベンジ問題</h2>
<p style="font-size:14px;color:#666;">まちがえた漢字をもう一度練習しましょう。</p>
<div id="mistakeList"></div>
<button id="revengeBtn" class="btn green" onclick="startMistakeQuiz()">&#x1F501; リベンジする</button>
<button class="btn secondary" onclick="showScreen('home')">&#x2B05;&#xFE0F; 戻る</button>
</div>
</section>

です。","kanji":"谷","reading":"こく","level":"N2","theme":""}];
let quizQuestions=[];
let currentIndex=0;
let currentQuestion=null;
let quizXP=0;
let streak=0;
let correctCount=0;
let answered=false;
let mistakeMode=false;
let learned=JSON.parse(localStorage.getItem('kanjiQuestLearned')||'{}');
let mistakes=JSON.parse(localStorage.getItem('kanjiQuestMistakes')||'{}');
let totalXP=Number(localStorage.getItem('kanjiQuestXP')||0);
let bestStreak=Number(localStorage.getItem('kanjiQuestBestStreak')||0);
function showScreen(id){
document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
document.getElementById(id).classList.add('active');
window.scrollTo({top:0,behavior:'instant'});
updateHomeStats();
}
function esc(s){
return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function removeRuby(s){
return String(s).replace(/<rt[^>]*>.*?<\/rt>/gi,'').replace(/<rp[^>]*>.*?<\/rp>/gi,'').replace(/<ruby[^>]*>/gi,'').replace(/<\/ruby>/gi,'');
}
function makeQuestionSentence(q){
let s=removeRuby(q.sentence);
let target=q.kanji;
if(s.indexOf(target)>=0){
s=esc(s);
s=s.split(esc(target)).join('<span class="blank">【　　】</span>');
}else{
s=esc(s);
}
return s;
}
function setupThemes(){
const themes=[...new Set(questions.map(q=>q.theme).filter(x=>x))].sort();
const select=document.getElementById('themeSelect');
themes.forEach(t=>{
let o=document.createElement('option');
o.value=t;
o.textContent=t;
select.appendChild(o);
});
}
function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
return arr;
}
function startQuiz(){
mistakeMode=false;
currentIndex=0;
quizXP=0;
streak=0;
correctCount=0;
const level=document.getElementById('levelSelect').value;
const theme=document.getElementById('themeSelect').value;
const count=document.getElementById('countSelect').value;
quizQuestions=questions.filter(q=>(level==='ALL'||q.level===level)&&(theme==='ALL'||q.theme===theme));
quizQuestions=shuffle([...quizQuestions]);
if(count!=='ALL')quizQuestions=quizQuestions.slice(0,Number(count));
if(quizQuestions.length===0){
alert('この条件の問題がありません。');
return;
}
showScreen('quiz');
showQuestion();
}
function makeChoices(q){
let candidates=[];
let sameLevel=questions.filter(x=>x.level===q.level&&x.kanji!==q.kanji);
let others=questions.filter(x=>x.kanji!==q.kanji);
shuffle(sameLevel);
shuffle(others);
for(const x of sameLevel){
if(!candidates.some(c=>c.kanji===x.kanji))candidates.push(x);
if(candidates.length>=3)break;
}
for(const x of others){
if(!candidates.some(c=>c.kanji===x.kanji))candidates.push(x);
if(candidates.length>=3)break;
}
candidates.push(q);
return shuffle(candidates);
}
function showQuestion(){
answered=false;
currentQuestion=quizQuestions[currentIndex];
const q=currentQuestion;
document.getElementById('questionNo').textContent='問題 '+(currentIndex+1)+' / '+quizQuestions.length;
document.getElementById('progressBar').style.width=((currentIndex/quizQuestions.length)*100)+'%';
document.getElementById('quizLevel').textContent=q.level||'';
document.getElementById('quizTheme').textContent=q.theme||'';
document.getElementById('sentence').innerHTML=makeQuestionSentence(q);
document.getElementById('readingHint').innerHTML='&#x1F4A1; 読み：<strong>'+esc(q.reading)+'</strong>';
document.getElementById('quizTotal').textContent=quizQuestions.length;
const choices=document.getElementById('choices');
choices.innerHTML='';
const feedback=document.getElementById('feedback');
feedback.className='feedback';
feedback.innerHTML='';
document.getElementById('nextBtn').style.display='none';
const options=makeChoices(q);
options.forEach(o=>{
const btn=document.createElement('button');
btn.className='choice';
btn.textContent=o.kanji;
btn.onclick=()=>answerQuestion(o,btn);
choices.appendChild(btn);
});
updateQuizStats();
}
function answerQuestion(selected,button){
if(answered)return;
answered=true;
const q=currentQuestion;
document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
const correct=selected.kanji===q.kanji;
if(correct){
button.classList.add('correct');
streak++;
correctCount++;
let gained=10;
if(streak>=5)gained+=5;
quizXP+=gained;
totalXP+=gained;
learned[q.kanji]={kanji:q.kanji,reading:q.reading};
delete mistakes[q.kanji];
if(streak>bestStreak)bestStreak=streak;
saveData();
showFeedback(true,q,gained);
}else{
button.classList.add('wrong');
streak=0;
mistakes[q.kanji]=q;
saveData();
document.querySelectorAll('.choice').forEach(b=>{
if(b.textContent===q.kanji)b.classList.add('correct');
});
showFeedback(false,q,0);
}
updateQuizStats();
document.getElementById('nextBtn').style.display='block';
}
function showFeedback(correct,q,gained){
const f=document.getElementById('feedback');
if(correct){
f.className='feedback correct';
f.innerHTML='&#x1F389; 正解！'+'<span class="feedbackKanji">'+esc(q.kanji)+'</span>'+'「'+esc(q.reading)+'」です。<br>+'+gained+' XP';
}else{
f.className='feedback wrong';
f.innerHTML='&#x1F4A1; もう一度覚えましょう！'+'<span class="feedbackKanji">'+esc(q.kanji)+'</span>'+'「'+esc(q.reading)+'」です。';
}
}
function nextQuestion(){
currentIndex++;
if(currentIndex>=quizQuestions.length){
finishQuiz();
}else{
showQuestion();
window.scrollTo({top:0,behavior:'smooth'});
}
}
function updateQuizStats(){
document.getElementById('quizXP').textContent=quizXP;
document.getElementById('quizStreak').textContent=streak;
document.getElementById('quizCorrect').textContent=correctCount;
document.getElementById('headerXP').textContent=totalXP;
}
function finishQuiz(){
document.getElementById('resultScore').textContent=correctCount+' / '+quizQuestions.length;
document.getElementById('resultXP').textContent=quizXP;
document.getElementById('resultStreak').textContent=streak;
document.getElementById('resultLearned').textContent=Object.keys(learned).length;
let rate=correctCount/quizQuestions.length;
let msg='';
if(rate===1){msg='&#x1F451; パーフェクト！';}else if(rate>=.8){msg='&#x1F31F; すばらしいです！';}else if(rate>=.5){msg='&#x1F4AA; よくがんばりました！';}else{msg='&#x1F4DA; まちがえた漢字を復習しましょう！';}
document.getElementById('resultMessage').innerHTML=msg;
showScreen('result');
}
function saveData(){
localStorage.setItem('kanjiQuestLearned',JSON.stringify(learned));
localStorage.setItem('kanjiQuestMistakes',JSON.stringify(mistakes));
localStorage.setItem('kanjiQuestXP',totalXP);
localStorage.setItem('kanjiQuestBestStreak',bestStreak);
}
function updateHomeStats(){
document.getElementById('homeXP').textContent=totalXP;
document.getElementById('homeLearned').textContent=Object.keys(learned).length;
document.getElementById('homeBest').textContent=bestStreak;
document.getElementById('headerXP').textContent=totalXP;
}
function showCollection(){
const grid=document.getElementById('collectionGrid');
grid.innerHTML='';
const list=Object.values(learned);
if(list.length===0){
grid.innerHTML='<div class="empty" style="grid-column:1/-1;">'+'&#x1F331;<br>まだ覚えた漢字がありません。<br>'+'ミッションに挑戦しましょう！</div>';
}else{
list.sort((a,b)=>a.kanji.localeCompare(b.kanji));
list.forEach(x=>{
const div=document.createElement('div');
div.className='kanjiCard';
div.innerHTML='<div class="k">'+esc(x.kanji)+'</div>'+'<div class="r">'+esc(x.reading)+'</div>';
grid.appendChild(div);
});
}
showScreen('collection');
}
function showMistakes(){
const list=document.getElementById('mistakeList');
list.innerHTML='';
const arr=Object.values(mistakes);
const btn=document.getElementById('revengeBtn');
if(arr.length===0){
list.innerHTML='<div class="empty">&#x1F389;<br>'+'現在、リベンジする問題はありません！</div>';
btn.style.display='none';
}else{
btn.style.display='block';
arr.forEach(x=>{
const div=document.createElement('div');
div.className='card';
div.style.padding='13px';
div.innerHTML='<strong style="font-size:28px;">'+esc(x.kanji)+'</strong>'+'　'+esc(x.reading)+'<br>'+'<span style="font-size:13px;color:#777;">'+esc(removeRuby(x.sentence))+'</span>';
list.appendChild(div);
});
}
showScreen('mistakes');
}
function startMistakeQuiz(){
const arr=Object.values(mistakes);
if(arr.length===0)return;
mistakeMode=true;
currentIndex=0;
quizXP=0;
streak=0;
correctCount=0;
quizQuestions=shuffle([...arr]);
showScreen('quiz');
showQuestion();
}
setupThemes();
updateHomeStats();
</script>
